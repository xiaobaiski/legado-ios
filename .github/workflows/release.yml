name: Release IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.1)'
        required: false
        default: 'v1.1.1'

jobs:
  release-ipa:
    name: Build & Publish Official Release IPA
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup tools
        run: |
          brew install xcodegen swiftlint xcbeautify

      - name: Lint Swift code
        run: |
          swiftlint lint

      - name: Generate Xcode project
        run: |
          make generate

      - name: Run Unit Tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          fi
          echo "Using simulator device ID: $DEVICE_ID"
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:LegadoTests \
            -skip-testing:LegadoTests/RealBookSourceTests \
            -skip-testing:LegadoTests/RealBookSourceE2ETests \
            test | xcbeautify

      - name: Build Release Archive (Unsigned iOS Device)
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Legado.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | xcbeautify

      - name: Package Release IPA
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          mkdir -p build/Payload
          cp -r build/Legado.xcarchive/Products/Applications/Legado.app build/Payload/
          cd build
          zip -r -q "Legado-${VERSION}.ipa" Payload
          ls -lh "Legado-${VERSION}.ipa"

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Legado-Release-IPA-${{ github.ref_name }}
          path: build/Legado-*.ipa
          retention-days: 30

      - name: Publish Official GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          export VERSION="${TAG_NAME#v}"
          IPA_FILE="build/Legado-${VERSION}.ipa"

          python3 - <<'PY'
          import os
          ver = os.environ["VERSION"]
          section = ""
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()
          marker = f"## [{ver}]"
          if marker in text:
              part = text.split(marker, 1)[1]
              if "\n## [" in part:
                  part = part.split("\n## [", 1)[0]
              section = part.strip()

          lines = [
              f"## 🎉 Legado iOS {ver} 正式版（纯阅读体验版）",
              "",
              "原生 iOS 18+ / iPadOS 纯本地电子书阅读器，采用 Apple Liquid Glass 美学与 MVI 架构，深度对标 Legado 核心阅读排版与净化能力。",
          ]
          if section:
              lines.extend(["", section])
          lines.extend([
              "",
              "### 📦 安装说明",
              f"- 附件 **`Legado-{ver}.ipa`** 为未签名真机安装包，适用于 TrollStore（巨魔）、AltStore、SideStore 或个人开发者证书自签名安装（要求 iOS 18.0+ / iPadOS 18.0+）。",
          ])
          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

          gh release create "$TAG_NAME" "${IPA_FILE}#Legado-${VERSION}.ipa" \
            --target "${{ github.sha }}" \
            --title "Legado iOS ${TAG_NAME} 正式版" \
            --notes-file release_notes.md \
            --latest
